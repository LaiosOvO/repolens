interface:
  display_name: "仓库业务功能报告"
  short_description: "纯 Skill 闭合核心业务覆盖并深入解释源码机制"
  default_prompt: "使用 $repository-report 分析指定源码仓库：先为当前源码快照建立或验证 CodeGraph，再建立全量产品表面账本，并在正文中明确列出‘用户能直接体验的业务功能’和‘核心功能有哪些’及两者映射。对每个核心功能，从当前 CodeGraph 与源码 evidence 动态生成复现该机制必须回答的问题，先用不限段数的自然语言闭合输入、控制规则、转换/执行、状态、时序/并发、外部交接、终止和可见结果，然后才能放交互图、组件表和源码证据。不按仓库名、领域或固定段数套模板；任一功能不能在不看图时独立讲清，就不得生成 HTML。"
