interface:
  display_name: "仓库业务功能报告"
  short_description: "纯 Skill 闭合核心业务覆盖并深入解释源码机制"
  default_prompt: "使用 $repository-report 直接分析指定源码仓库：先建立全量产品表面账本，并按用户视角自然语言列出可体验的业务功能；再给出核心功能自然语言总览与业务到机制映射，从当前源码追踪配置到运行时接线，为每个功能按总—分—总讲清输入、决策、执行位置、状态、协作/集成边界与最终输出；所有 Leader、phase、child、SDK 等实现术语必须说明对象、创建者、读取者、触发与不触发的行为；有一手来源时客观对照同类实现但不代选；最后生成阶段 Markdown 与带侧边栏的 HTML。"
