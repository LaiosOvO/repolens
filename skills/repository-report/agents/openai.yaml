interface:
  display_name: "仓库业务功能报告"
  short_description: "纯 Skill 闭合核心业务覆盖并深入解释源码机制"
  default_prompt: "使用 $repository-report 直接分析指定源码仓库：先建立全量产品表面账本，再在正文中明确列出‘用户能直接体验的业务功能’和‘核心功能有哪些’，建立两者映射。每个核心功能必须先用 3–6 段连续自然语言讲清入口、判定规则、转换/执行、状态提交、终止和用户结果，然后才能放交互图、组件表和源码证据；工作流必须解释定义如何变成运行时、边如何决策和状态如何切换，实时语音必须解释 transport/codec、VAD、ASR、LLM/Tool、TTS、回传、打断与结束。任一清单或图前自然语言缺失就不得生成 HTML。"
